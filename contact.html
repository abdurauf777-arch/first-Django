<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="icon" type="image/x-icon" href="pngegg.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Contact Us</h1>
            <p>If you need help with your project, reach out to us!</p>
        </header>
        
        <div class="Massage">
            <form action="">
                <div class="input-group">
                    <input type="email" placeholder="Write your email here!" required>
                </div>
                <div class="input-group">
                    <input type="tel" placeholder="Your contact number" required>
                </div>
                <div class="input-group">
                    <textarea placeholder="Your Message" rows="4" required></textarea>
                </div>
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                </div>
                <button type="submit" class="submit">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
